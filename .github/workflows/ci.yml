name: ci

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04 }
          - { os: macos-26 }
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Test
        if: runner.os == 'Linux'
        run: |
          cmake -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLIBINTL_LITE_BUILD_TESTS=ON
          cmake --build build-tests
          ctest --test-dir build-tests --output-on-failure
